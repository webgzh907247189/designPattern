<!DOCTYPE html>
<html>
<head>
	<title></title>
</head>
<body>
    加个 native 代表是原生的对象
    e.stopPropagation() 阻止向上冒泡，但是本级剩下的监听函数还是会执行
    e.stopImmediatePropagation() 阻止同级传播 但是本级剩下的监听函数不会执行

    react 16 事件代理在 document 上面， 16 执行 stopPropagation ，没办法阻止冒泡到 document 上面，所以要使用 stopImmediatePropagation
    17代理在容器上面
	<div id="root">
        <div id="parent">
            <div id="child">react 17 事件 委托的不再是 document 而是容器，可以让一个页面多个 react 版本共存</div>
        </div>
    </div>
</body>
<script>
    // document元素原生捕获
    // 父元素 react 捕获
    // 子元素 react 捕获
    // 父元素原生捕获
    // 子元素原生捕获
    // 子元素原生冒泡
    // 父元素原生冒泡
    // 子元素 react 冒泡
    // 父元素 react 冒泡
    // document元素原生冒泡

    function dispatch(e, useCapture){
        let paths = []
        let current = e.target
        while(current){
            paths.push(current)
            current = current.parentNode
        }
        if(useCapture){
            for (let len = paths.length - 1; len >= 0; len--) {
                const fn = paths[len].onClickCapture;
                fn && fn()
            }
        }else{
            for (let len = 0; len < paths.length; len++) {
                const fn = paths[len].onClick;
                fn && fn()
            }
        }
    }

    root.addEventListener('click',(e) => dispatch(e, true), true)
    root.addEventListener('click',dispatch)

    let parent = document.getElementById('parent')
    let child = document.getElementById('child')

    parent.addEventListener('click', () => {
        console.log('父元素原生捕获')
    }, true)
    parent.addEventListener('click', () => {
        console.log('父元素原生冒泡')
    })

    child.addEventListener('click', () => {
        console.log('子元素原生捕获')
    }, true)
    child.addEventListener('click', () => {
        console.log('子元素原生冒泡')
    })

    document.addEventListener('click', () => {
        console.log('document元素原生捕获')
    }, true)
    document.addEventListener('click', () => {
        console.log('document元素原生冒泡')
    })

    parent.onClick = function(){
        console.log('父元素 react 冒泡')
    }
    parent.onClickCapture = function(){
        console.log('父元素 react 捕获')
    }

    child.onClick = function(){
        console.log('子元素 react 冒泡')
    }
    child.onClickCapture = function(){
        console.log('子元素 react 捕获')
    }
</script>
</html>
