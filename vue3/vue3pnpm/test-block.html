<!DOCTYPE html>
<html lang="en">

    <meta charset="UTF-8">
    <title>monitor</title>
</head>
<body>
    <div id="container">
        
    </div>
</body>
<script src="./packages/runtime-dom/dist/runtime-dom.global.js">
</script>


<!-- <script src="./node_modules/.pnpm/vue@3.2.33//node_modules//@vue//runtime-dom/dist//runtime-dom.global.js"> -->

</script>
<script type="module">
    // 原始的 vue 提供的
    // import { createRenderer, h, render, Text as TEXT, Fragment as FRAGEMENT } from './node_modules/vue/dist/vue.esm-browser.js'
    
    const { _openBlock, _createElementBlock, _createElementVNode, _toDisplayString, ref, createRenderer, h, render, TEXT, FRAGEMENT, reactive, toRefs, onBeforeMount, onMounted, onBeforeUpdate, onUpdated, onBeforeUnmount, onUnmounted, getCurrentInstance, inject, provide } = VueRuntimeDOM

    let renderer = createRenderer({
        createElement(ele){
            return document.createElement(ele)
        },
        setElementText(el, text){
            el.innerHTML = text
        },
        patchProp(el, key, prevVal, nextVal){
            console.log(key, prevVal, nextVal, 'patchProp')
            if(key === 'style'){
                for (const key1 in nextVal) {
                   const val = nextVal[key1]
                   el.setAttribute(key1, val)
                }
            }
        },
        insert(el, container){
            container.appendChild(el)
        }
    })


    // 组件的组成有几部分？ 组件的好处是什么？ vue的组件有什么特点？
    // 组件化 (对Ui的封装，自己的状态，外面传入的props)
    // 模块化 (对业务的封装)
    const VueComponent = {
        setup(props, context){

            // const slots = context.slots
            // // 1. 业务逻辑都在 setup 编写
            // // 2. setup 返回值会放到 render 函数中以 proxy 参数形式存在
            const state1 = reactive({name: '1', age: 10})

            setTimeout(() => {
                state1.age = 33
            }, 3000);
            return {
                // ...slots,
                ...toRefs(state1)
            }
        },

        // props 是一个浅响应式的，使用 shallowReactive ( {a: 1, b: 2, c: { test: 'c' } }, 深层 c 属性 不是响应式的，  更改 a、b 会触发视图更新，改 c 不会触发视图更新 )
        // 属性分为两种: 第一种:props & 第二种: attrs (开发环境下是 响应式的， 生产环境下 非响应式的)
        // attrs = 用户传递的 props - propsOptions (用户传递的 props 没有被消费的都放到了 attrs 中)

        // 没有做渲染合并，就多出现更新多次数组，更新多次组件
        render(proxy){
            const dynamic = (_openBlock(), _createElementBlock("div", null, [
                _createElementVNode("h1", null, "hahaha", -1 /* CACHED */),
                _createElementVNode("span", null, _toDisplayString(proxy.name), 1 /* TEXT */),
                _createElementVNode("p", null, [
                    _createElementVNode("span", null, _toDisplayString(proxy.age), 1 /* TEXT */)
                ])
            ]))

            // _createElementVNode 第4个参数 大于 0 都是动态节点
            // block 节点会忽略层级, 把当前跟节点下面所有的 动态节点全部收集起来 ({{state1.name}}, {{state1.age}}), 作为动态节点
            // _createElementVNode 第4个参数 大于 0 都是动态节点

            return dynamic
        }
    }

    debugger
    // 组件渲染 返回的是 vnode (vnode 可以是 组件 也可以是 元素)

    // 组件的儿子就是插槽， 插槽一定是一个对象
    render(h(VueComponent), container)
</script>
</html>
